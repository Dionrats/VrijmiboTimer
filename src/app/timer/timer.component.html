<div class="clock-item">
    <div class="inner">
        <div class="text">
            <p class="val" [class.ticking]="ticking">{{state}}</p>
            <p class="type-time">{{timer.title}}</p>
        </div>
        <svg class="progress-ring">
            <circle #circle
                class="progress-ring__circle"
                stroke-width="10"
                fill="transparent"
                r="48%"
                cx="50%"
                cy="50%"/>
        </svg>
    </div>
</div>
